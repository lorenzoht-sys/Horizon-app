name: Sécurité

on:
  push:
    branches: [main, consolidation]
  pull_request:
  # Analyse gitleaks de l'historique COMPLET, chaque lundi à 6 h UTC (job
  # gitleaks-historique). Le job audit, lui, ne regarde que les commits
  # poussés ; il ne tourne pas sur ce déclencheur.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  # Vérifications statiques + tests de sécurité : gitleaks (secrets dans
  # l'historique), npm audit, typecheck des routes api/*, build + recherche
  # de secrets dans le bundle client, puis le harnais RLS (tests/security/).
  # Ce dernier est auto-skip par vitest (voir tests/security/rls.spec.ts) tant
  # que les secrets STAGING_* ne sont pas configurés dans ce dépôt — mais un
  # skip fait ÉCHOUER ce job (voir l'étape ci-dessous) : un run vert n'est
  # valable que si le harnais a réellement tourné, jamais parce qu'il a été
  # silencieusement ignoré.
  audit:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historique complet, nécessaire à gitleaks

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          # 22, pas 20 : le harnais RLS (ci-dessous) appelle
          # @supabase/supabase-js createClient(), qui initialise son client
          # Realtime et exige un WebSocket natif — absent avant Node 22, ce
          # qui fait échouer createClient() dès l'appel (constaté le
          # 2026-08-26, "Node.js 20 detected without native WebSocket
          # support"). ci.yml reste en Node 20 : son job e2e n'instancie
          # jamais de client Supabase côté Node (aucun import
          # @supabase/supabase-js dans e2e/*.ts), donc pas concerné.
          node-version: 22
          cache: npm

      - run: npm ci

      # ⚠️ TEMPORAIRE — contournement, pas une solution. Depuis le lot B
      # sécurité HDS (2026-10-27), `npm audit --omit=dev` ne remonte plus
      # qu'UNE vulnérabilité :
      #   - xlsx (prototype pollution, ReDoS), sans correctif sur npm —
      #     décision séparée à prendre (SheetJS hors npm, exceljs, ou import
      #     CSV seul). Les autres (dompurify, nanoid, pdfjs-dist, postcss,
      #     react-router…) sont corrigées.
      # `continue-on-error` empêche seulement cette étape de bloquer le job
      # (et donc d'empêcher le harnais RLS ci-dessous de s'exécuter) — le
      # rapport complet de `npm audit` reste intégralement affiché dans les
      # logs de cette étape, qui apparaît en avertissement (⚠) et non en vert
      # dans l'interface GitHub. À rendre bloquant (retirer
      # `continue-on-error`) dès que xlsx est tranché.
      - name: npm audit (non bloquant temporairement — voir commentaire ci-dessus)
        run: npm audit --audit-level=high --production
        continue-on-error: true

      - run: npm run typecheck:api
      - run: npm run build

      - name: Aucun secret serveur dans le bundle client
        run: |
          if grep -rEq "service_role|sk-ant-|BEGIN [A-Z ]*PRIVATE KEY" dist/; then
            echo "::error::Secret détecté dans dist/ (bundle envoyé au navigateur)"
            exit 1
          fi

      - name: Harnais de sécurité (RLS multi-tenant) — un skip est un échec, jamais un vert silencieux
        # La logique de contrôle vit dans scripts/verifier-resultat-harnais.mjs
        # et non plus en ligne ici. Elle contenait un défaut invisible : le
        # contrôle des SKIP était placé après celui des échecs, qui sort en
        # exit(1) — et un test échoue en permanence (couverture
        # information_schema, échec connu et accepté). Le contrôle des skips
        # n'a donc JAMAIS pu s'exécuter, malgré le nom de cette étape.
        # Sorti du YAML pour qu'il soit exécutable — et donc vérifiable —
        # hors de la CI : `node scripts/verifier-resultat-harnais.mjs <json>`.
        run: |
          npx vitest run tests/security --reporter=json --outputFile=vitest-security-result.json || true
          node scripts/verifier-resultat-harnais.mjs vitest-security-result.json
        env:
          SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
          SUPABASE_TEST_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
          SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
          PATIENT_SESSION_SECRET: ${{ secrets.PATIENT_SESSION_SECRET }}
          STAGING_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
          # Réutilise les mêmes secrets/variables de dépôt que le job e2e de
          # ci.yml (staging.praticien@example.com et les codes de démo de
          # scripts/seed-staging.sql) plutôt que d'en dupliquer sous un autre nom.
          E2E_PRATICIEN_EMAIL: ${{ vars.E2E_PRATICIEN_EMAIL }}
          E2E_PRATICIEN_PASSWORD: ${{ secrets.E2E_PRATICIEN_PASSWORD }}
          E2E_PATIENT_CODE: ${{ vars.E2E_PATIENT_CODE }}
          E2E_PATIENT_CODE_2: ${{ vars.E2E_PATIENT_CODE_2 }}
          E2E_STRUCTURE_TOKEN: ${{ vars.E2E_STRUCTURE_TOKEN }}

  # Cloisonnement et intégrité de la facturation (factures, lignes_facture,
  # paiements, ca_externe, envois_factures…) : tests/db/*.spec.ts, qu'aucun
  # workflow ne lançait (lot I sécurité HDS, 2026-10-27). Ils tournent sur
  # une base Supabase LOCALE démarrée dans le runner : migrations du dépôt et
  # seed fictif (supabase/seed.sql), clés de démo publiques de la CLI.
  # Aucun secret, aucune base distante. Les tests refusent eux-mêmes toute
  # cible autre que 127.0.0.1 (voir tests/db/facturation.spec.ts).
  base-locale:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@v1
        with:
          version: 2.119.0

      # Services inutiles aux tests exclus pour accélérer le démarrage ; restent
      # Postgres, Auth (gotrue), PostgREST, Storage et Kong. Validé en local le
      # 2026-10-27 : 253/253 tests avec exactement cette liste.
      - name: Base Supabase locale (migrations du dépôt + seed fictif)
        run: supabase start -x realtime,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor

      - name: tests/db — un skip est un échec, jamais un vert silencieux
        run: |
          npx vitest run tests/db --reporter=json --outputFile=vitest-db-result.json || true
          node scripts/verifier-resultat-harnais.mjs vitest-db-result.json tests/db

  # Historique complet, valeurs masquées (--redact) : le journal ne montre que
  # fichier, commit et règle. Les constats déjà examinés sont dans
  # .gitleaksignore, avec leur justification.
  gitleaks-historique:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks — historique complet de toutes les branches
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --log-opts="--all" --redact --no-banner -v \
            --gitleaks-ignore-path /repo/.gitleaksignore
