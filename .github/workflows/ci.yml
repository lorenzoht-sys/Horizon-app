name: CI

on:
  push:
    branches: [main, consolidation]
  pull_request:

jobs:
  # Vérifications statiques : toujours exécutées, ne dépendent d'aucun
  # environnement de staging. Volontairement SANS `npm run lint` (erreurs
  # de lint pré-existantes, hors périmètre de la consolidation — voir
  # docs/archive/AUDIT.md et docs/PLAN-BETA.md).
  # Serveur de la cible Clever Cloud (clevercloud/serveur) : il exécute les
  # routes api/ et les Edge Functions sans les modifier. Job à part, en Node 22 :
  # le serveur lit directement le TypeScript des fonctions (Node >= 22.18), ce
  # que le Node 20 du job `build` ne sait pas faire. `npm ci` est nécessaire pour
  # charger les trois vraies fonctions et composer un PDF de facture.
  serveur-clevercloud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test clevercloud/serveur/*.test.mjs

  # Répétition à blanc de la cible HDS : le schéma du dépôt est reconstruit sur
  # un PostgreSQL 17 STANDARD (sans Supabase), puis lu et écrit par le chemin
  # réel du front praticien : serveur Node → PostgREST → RLS. Données fictives.
  # Aucun secret : la base vit le temps du job.
  repetition-cible:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: repetition
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PGURI: postgresql://postgres:repetition@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Secret des jetons tiré au hasard à chaque job : rien de fixe dans le dépôt.
      - name: Secret de test pour les jetons
        run: echo "REPETITION_JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Schéma, jeu fictif et contrôles de RLS
        run: clevercloud/scripts/repetition.sh

      # Même image et mêmes réglages que clevercloud/postgrest/, sauf le secret
      # des jetons (de test) et le port.
      - name: PostgREST
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI="$PGURI" -e PGRST_DB_SCHEMAS=public \
            -e PGRST_DB_EXTRA_SEARCH_PATH=public,extensions -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_DB_MAX_ROWS=1000 -e PGRST_OPENAPI_MODE=disabled \
            -e PGRST_JWT_SECRET="$REPETITION_JWT_SECRET" -e PGRST_SERVER_PORT=3000 \
            postgrest/postgrest:v12.2.3
          for i in $(seq 1 30); do curl -fsS -o /dev/null http://localhost:3000/participants?limit=0 -H "Accept: application/json" && break; sleep 1; done
          docker logs postgrest 2>&1 | tail -5

      - name: Lecture et écriture par le serveur Node et PostgREST
        run: node --test clevercloud/scripts/repetition-http.test.mjs
        env:
          POSTGREST_URL: http://localhost:3000

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm run typecheck:api
      - run: npm run typecheck:e2e

      # Tests unitaires (api/, src/lib/, src/utils/). Ajoutés le 2026-08-29 :
      # ils n'étaient exécutés par AUCUN workflow, et 3 tests de
      # api/_lib/patientSession.test.ts échouaient depuis des semaines sans
      # que personne le voie — le faux client Supabase décrivait une
      # implémentation remplacée depuis. Corrigés dans la même PR, sinon
      # cette étape aurait rendu la CI rouge dès son ajout.
      #
      # `test:unit:ci` et non `test:unit` : ce dernier inclut aussi
      # tests/security/, qui a son propre job `audit` (security.yml) avec les
      # secrets de staging. Sans ces secrets ici, le harnais s'auto-skiperait
      # — 64 tests passant pour verts sans rien vérifier, exactement le vert
      # silencieux que ce projet combat. L'exclusion rend la frontière
      # explicite : ce job ne fait tourner que ce qu'il peut vraiment vérifier.
      - run: npm run test:unit:ci

  # Suite E2E Playwright — cible un déploiement Vercel de Preview branché sur
  # le projet Supabase de STAGING (voir docs/GUIDE_STAGING.md et e2e/README.md).
  #
  # ── Comment la cible est choisie, et pourquoi ────────────────────────────
  # Ce job ciblait auparavant une URL figée (`vars.E2E_BASE_URL`), pointant
  # sur le Preview de la branche `staging`. Deux défauts, tous deux constatés
  # le 2026-08-27 :
  #   1. La branche `staging` avait 46 commits de retard sur `main` : la CI
  #      validait du code vieux de cinq jours en croyant valider le commit
  #      courant.
  #   2. Le déploiement est derrière l'authentification Vercel, que la CI ne
  #      franchissait pas — d'où une douzaine de tests rouges depuis des
  #      jours, pour une cause située hors du code testé.
  #
  # Désormais la cible est RÉSOLUE À CHAQUE RUN, à partir du commit testé :
  #   - sur une pull request : le Preview de la PR elle-même (environnement
  #     Vercel « Preview », donc Supabase de staging) ;
  #   - sur un push sur `main` : `main` part en PRODUCTION, sur la base
  #     Supabase de PRODUCTION — jamais une cible de test acceptable. On
  #     resynchronise donc la branche `staging` sur le commit poussé et on
  #     teste SON Preview.
  #
  # `vars.E2E_BASE_URL` ne sert plus d'URL : uniquement d'interrupteur
  # (job ignoré tant qu'elle est vide), pour préserver le comportement
  # documenté dans e2e/README.md.
  e2e:
    needs: build
    # Image figée (2026-11-10) : ubuntu-latest est passé à Ubuntu 26.04, que
    # Playwright 1.60 ne sait pas équiper (« does not support chromium on
    # ubuntu26.04 ») : l'e2e échouait avant de lancer un seul test. À relever
    # en même temps que la version de Playwright.
    runs-on: ubuntu-24.04
    # Un seul e2e à la fois, toutes branches confondues (2026-11-10) : tous les
    # runs partagent le même staging (mêmes bénéficiaires de démo, même
    # rate-limit de connexion patient). Deux runs simultanés se marchent
    # dessus : constaté le 2026-11-10, deux PR lancées à une minute d'écart
    # ont échoué sur des tests différents, l'une archivant le bénéficiaire que
    # l'autre cherchait. Les runs suivants attendent leur tour ; GitHub ne
    # garde qu'un run en attente par groupe (le plus récent).
    concurrency:
      group: e2e-staging
      cancel-in-progress: false
    if: >-
      vars.E2E_BASE_URL != '' &&
      (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    permissions:
      contents: write # resynchronise la branche `staging` sur les push sur main
      deployments: read # lit l'URL du déploiement Vercel du commit testé
    env:
      E2E_PRATICIEN_EMAIL: ${{ vars.E2E_PRATICIEN_EMAIL }}
      E2E_PRATICIEN_PASSWORD: ${{ secrets.E2E_PRATICIEN_PASSWORD }}
      E2E_PATIENT_CODE: ${{ vars.E2E_PATIENT_CODE }}
      E2E_PATIENT_PRENOM: ${{ vars.E2E_PATIENT_PRENOM }}
      E2E_PATIENT_NOM: ${{ vars.E2E_PATIENT_NOM }}
      E2E_PATIENT_CODE_2: ${{ vars.E2E_PATIENT_CODE_2 }}
      E2E_PATIENT_PRENOM_2: ${{ vars.E2E_PATIENT_PRENOM_2 }}
      E2E_PATIENT_NOM_2: ${{ vars.E2E_PATIENT_NOM_2 }}
      E2E_STRUCTURE_TOKEN: ${{ vars.E2E_STRUCTURE_TOKEN }}
      # Sans ce secret, la sonde de e2e/global-setup.ts arrête la suite avec
      # un message explicite au lieu de laisser tous les tests expirer.
      VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      # Uniquement pour remettre à zéro les séances du jour avant le run
      # (voir l'étape dédiée plus bas). PostgREST + service_role, et non
      # STAGING_DATABASE_URL : la connexion Postgres directe n'est joignable
      # qu'en IPv6, que les runners GitHub n'ont pas (ENETUNREACH — même
      # limitation que le bloc « Findings structurels » du harnais, voir
      # docs/PLAN-BETA.md). Le script porte le même garde-fou anti-production
      # que les autres scripts de staging.
      SUPABASE_TEST_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_TEST_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Cibler le Preview de la pull request
        if: github.event_name == 'pull_request'
        run: |
          echo "SHA_CIBLE=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_ENV"
          echo "NOM_CIBLE=PR #${{ github.event.pull_request.number }}" >> "$GITHUB_ENV"

      - name: Resynchroniser la branche staging sur le commit poussé
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          # Force : `staging` porte un commit de déclenchement qui n'est pas
          # sur main, donc pas d'avance rapide possible. Ce commit n'a aucune
          # valeur (il ne servait qu'à créer le premier Preview).
          git push --force origin "${{ github.sha }}:refs/heads/staging"
          echo "SHA_CIBLE=${{ github.sha }}" >> "$GITHUB_ENV"
          echo "NOM_CIBLE=branche staging" >> "$GITHUB_ENV"

      - name: Attendre le déploiement Vercel de Preview et résoudre son URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          echo "Commit testé : $SHA_CIBLE ($NOM_CIBLE)"

          # Vercel enregistre un GitHub Deployment par build. On attend celui
          # dont l'environnement est un Preview (jamais Production : ce serait
          # la base Supabase de production) et dont un statut est `success`.
          for tentative in $(seq 1 60); do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA_CIBLE&per_page=100" \
                    --jq '.[].id' 2>/dev/null || true)
            for id in $ids; do
              nom_env=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" \
                          --jq '.environment' 2>/dev/null || true)
              case "$(echo "$nom_env" | tr '[:upper:]' '[:lower:]')" in
                *preview*)
                  url=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" \
                          --jq '[.[] | select(.state=="success") | .environment_url]
                                | map(select(. != null and . != "")) | first // empty' 2>/dev/null || true)
                  if [ -n "$url" ]; then
                    echo "Déploiement de Preview prêt : $url"
                    echo "E2E_BASE_URL=$url" >> "$GITHUB_ENV"
                    exit 0
                  fi
                  ;;
              esac
            done
            echo "  (tentative $tentative/60) aucun Preview prêt, nouvelle vérification dans 15 s"
            sleep 15
          done

          echo "::error::Aucun déploiement Vercel de Preview prêt pour $SHA_CIBLE après 15 minutes."
          echo "Déploiements vus pour ce commit :"
          gh api "repos/$GITHUB_REPOSITORY/deployments?sha=$SHA_CIBLE&per_page=100" \
            --jq '.[] | "  id=\(.id) environnement=\(.environment)"' || echo "  (aucun)"
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Rend la suite rejouable. `07-seance-coche-exercice` enregistre la
      # séance du jour du patient de démo ; un index unique interdit ensuite
      # de la revalider, si bien que le run suivant échouait sur un 409
      # parfaitement légitime. Sans cette remise à zéro, le test ne peut
      # passer qu'une fois par jour et par environnement.
      - name: Remettre le jeu de démo de staging dans un état connu
        if: env.SUPABASE_TEST_URL != ''
        run: npx tsx scripts/staging-reset-etat-e2e.ts --apply

      # Les dépendances système passent par les miroirs apt d'Ubuntu, parfois
      # indisponibles : le 2026-11-11, l'étape a échoué trois fois de suite
      # (« Some index files failed to download ») sans qu'aucun test ne tourne.
      # On tente donc l'installation complète dans un délai borné, puis, à
      # défaut, le navigateur seul : l'image du runner embarque déjà les
      # bibliothèques de Chrome. S'il en manquait une, l'e2e échouerait au
      # lancement du navigateur, avec un message explicite.
      - name: Installer Chromium pour Playwright
        run: |
          if timeout 240 npx playwright install --with-deps chromium; then exit 0; fi
          echo "::warning::Dépendances système indisponibles (miroirs apt) : installation du navigateur seul."
          npx playwright install chromium
      - run: npm run test:e2e

      # Diagnostic : conserve captures, traces (prises à la reprise) et contextes d'erreur Playwright,
      # y compris quand un test n'échoue qu'au premier essai puis passe à la reprise (job vert).
      # Sans cela, tout disparaît avec le runner.
      - name: Conserver les résultats Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-resultats
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
